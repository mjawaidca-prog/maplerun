<style>

.nav-item-row.missing{background:#fef2f2;color:#991b1b}

.tier-intro{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}

.tier-tag.growth{background:#dcfce7;color:#15803d}
.tier-tag.acct{background:#fee2e2;color:#991b1b}

.matrix{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e7e5e4;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.matrix thead th.growth{background:#f0fdf4;color:#15803d}
.matrix thead th.acct{background:#fef2f2;color:#991b1b}

.matrix tbody td:first-child{text-align:left;font-weight:600;background:#fafaf9}
.matrix tbody tr:last-child td{border-bottom:none}

/* Adaptive sidebar trio */
.side-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

  <!-- ═══════════════════════════════════════════════════ PLAN TIERING -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Plan Strategy</div>
    <div class=&quot;sec-title&quot;>One product, three plans — not everything for everyone</div>
    <div class=&quot;sec-sub&quot;>A solo business with 3 employees should never see the complexity a 40-person company needs. The fix is two design tools working together: <b>plan tiering</b> decides <i>what features exist</i> for a user, and <b>progressive disclosure</b> decides <i>how much is shown</i> even within a plan. MapleRun already does a little of this (ROE locked to the Accountant plan) — this section makes it systematic.</div>

    <div class=&quot;tier-intro&quot;>
      <div class=&quot;tier-card solo&quot;>
        <div class=&quot;tier-name&quot;>🌱 Solo</div>
        <div class=&quot;tier-for&quot;>Owner-operators &amp;amp; micro-business · 1–5 employees</div>
        <div class=&quot;tier-price&quot;>Run a simple pay run: <b>enter period, salary → calculated deductions.</b> Nothing more. This is essentially what MapleRun does <i>today</i>, kept deliberately minimal.</div>
        <div style=&quot;margin-top:12px&quot;><span class=&quot;tier-tag solo&quot;>Keep it simple</span></div>
      </div>
      <div class=&quot;tier-card growth&quot;>

        <div class=&quot;tier-for&quot;>Growing SMBs with hourly staff · 5–25 employees</div>
        <div class=&quot;tier-price&quot;>Adds timesheets, more pay types, remittance tracking, EFT files, and the core reports. The everyday operating plan for a real small business.</div>
        <div style=&quot;margin-top:12px&quot;><span class=&quot;tier-tag growth&quot;>Most customers</span> <span class=&quot;tier-tag current&quot;>≈ current</span></div>

        <div style=&quot;margin-top:12px&quot;><span class=&quot;tier-tag acct&quot;>Full power</span> <span class=&quot;tier-tag current&quot;>≈ current</span></div>

.fmap thead tr{background:#1c1917;color:#fff}
.fmap th{padding:11px 16px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fmap td{padding:12px 16px;border-bottom:1px solid #f0efed;vertical-align:top;font-size:13px}
.fmap tr:last-child td{border-bottom:none}
.fmap td:first-child{font-weight:600;white-space:nowrap}
.fmap a{color:#B3261E;text-decoration:none;font-weight:600}
.fmap a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px;letter-spacing:.03em}
.tag.target{background:#eff6ff;color:#1d4ed8}
.tag.ref{background:#f5f3ff;color:#6d28d9}
.tag.spec{background:#fef2f2;color:#991b1b}

/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h4{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lirow{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #f7f6f4;font-size:13px}
.lirow:last-child{border-bottom:none}
.lirow .i{flex-shrink:0}
.dont .lirow .i{color:#B3261E}
.do .lirow .i{color:#16a34a}

.checklist{background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:8px 22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ck{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #f0efed;font-size:13.5px;align-items:flex-start}
.ck:last-child{border-bottom:none}
.ck .box{width:17px;height:17px;border:2px solid #d6d3d1;border-radius:5px;flex-shrink:0;margin-top:1px}
.ck b{font-weight:700}
.ck .s{color:#78716c;font-size:12.5px;margin-top:1px}

.note{display:flex;gap:12px;border-radius:11px;padding:14px 18px;margin:14px 0}
.note.amber{background:#fffbeb;border:1px solid #fde68a}
.note.blue{background:#eff6ff;border:1px solid #bfdbfe}
.note .ni{font-size:16px}
.note .nt{font-size:13px;line-height:1.5}
.note.amber .nt{color:#92400e}
.note.blue .nt{color:#1e40af}
.note .nt b{font-weight:700}
@media print{body{background:#fff}.wrap{padding:24px 32px}}
</style>
</head>
<body>

<div class=&quot;header&quot;>
  <div class=&quot;hdr-logo&quot;><span>🍁</span> MapleRun</div>
  <div class=&quot;hdr-title&quot;>Coder Handoff — Plan Tiering Rollout</div>
  <div class=&quot;hdr-sub&quot;>Everything a developer needs to ship the Solo / Growth / Accountant model on top of the existing app — without breaking what works. Architecture, a 5-step build order, file map, and acceptance criteria.</div>
  <div class=&quot;hdr-chips&quot;>
    <span class=&quot;chip&quot;>For the dev implementing Steps 0–4</span>
    <span class=&quot;chip green&quot;>Additive · flag-gated · zero rewrites</span>
  </div>
</div>

<div class=&quot;wrap&quot;>

  <!-- PRINCIPLE -->
  <div class=&quot;principle&quot;>
    <div class=&quot;pi&quot;>🔑</div>
    <div class=&quot;pt&quot;><b>The one rule:</b> never refactor a working screen — only <b>wrap</b> it (to hide things) or <b>extend</b> it (to add things). Every step below is additive and gated by a single <code>company.plan</code> value. The simple case stays simple; complexity is reachable but never imposed.</div>
  </div>

  <!-- ARCHITECTURE -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Foundation</div>
    <div class=&quot;sec-title&quot;>The architecture — three primitives</div>
    <div class=&quot;sec-sub&quot;>Everything in the rollout rests on these three pieces. Build them once in Steps 0–1, then every later screen is a one-liner.</div>

    <div class=&quot;code&quot;><pre><span class=&quot;c&quot;>// 1. One source of truth on the company/account record</span>
<span class=&quot;k&quot;>type</span> Plan = <span class=&quot;s&quot;>'solo'</span> | <span class=&quot;s&quot;>'growth'</span> | <span class=&quot;s&quot;>'accountant'</span>;
company.plan = <span class=&quot;s&quot;>'growth'</span>;  <span class=&quot;c&quot;>// default EXISTING accounts here — see Step 0</span>

<span class=&quot;c&quot;>// 2. One capability map — features unlock at a tier and above</span>
<span class=&quot;k&quot;>const</span> TIERS = [<span class=&quot;s&quot;>'solo'</span>, <span class=&quot;s&quot;>'growth'</span>, <span class=&quot;s&quot;>'accountant'</span>];
<span class=&quot;k&quot;>const</span> REQUIRES = {
  timesheets:<span class=&quot;s&quot;>'growth'</span>, remittances:<span class=&quot;s&quot;>'growth'</span>, eft:<span class=&quot;s&quot;>'growth'</span>, roe:<span class=&quot;s&quot;>'growth'</span>,
  reportsCore:<span class=&quot;s&quot;>'growth'</span>, payTypesExtra:<span class=&quot;s&quot;>'growth'</span>,
  yearEndCentre:<span class=&quot;s&quot;>'accountant'</span>, gl:<span class=&quot;s&quot;>'accountant'</span>, auditLog:<span class=&quot;s&quot;>'accountant'</span>,
  quebec:<span class=&quot;s&quot;>'accountant'</span>, compliancePanel:<span class=&quot;s&quot;>'accountant'</span>, customReports:<span class=&quot;s&quot;>'accountant'</span>
};

<span class=&quot;c&quot;>// 3. One gate helper + one upgrade-prompt component</span>
<span class=&quot;k&quot;>function</span> <span class=&quot;f&quot;>can</span>(feature) {
  <span class=&quot;k&quot;>return</span> TIERS.indexOf(company.plan) &amp;gt;= TIERS.indexOf(REQUIRES[feature]);
}
<span class=&quot;c&quot;>// &amp;lt;UpgradePrompt feature=&quot;roe&quot; /&amp;gt;  — the existing ROE lock, generalised</span></pre></div>

    <div class=&quot;note blue&quot;><div class=&quot;ni&quot;>💡</div><div class=&quot;nt&quot;><b>You already have the pattern.</b> The current ROE / Payroll-Journal locks are exactly <code>can('roe')</code> + an upgrade card. Step 1 just extracts that into the shared helper and component above — then points the existing locks at it. No new behaviour, just centralisation.</div></div>
  </div>

  <!-- BUILD ORDER -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Build Order</div>
    <div class=&quot;sec-title&quot;>Five steps, lowest risk first</div>
    <div class=&quot;sec-sub&quot;>Ship in this order. Steps 0–1 change nothing users see (pure de-risking). Steps 2–4 are visible but additive. Each has its own acceptance criteria.</div>

    <div class=&quot;step s0&quot;>
      <div class=&quot;step-num&quot;>0</div>
      <div class=&quot;step-body&quot;>
        <div class=&quot;step-head&quot;><span class=&quot;step-title&quot;>Introduce the <code>plan</code> flag</span><span class=&quot;risk none&quot;>ZERO RISK</span></div>
        <div class=&quot;step-what&quot;>Add <code>plan</code> to the company record + the capability map &amp;amp; <code>can()</code> helper above. <b>Default every existing account to the tier that matches what they see today</b> (≈ <code>growth</code> / <code>accountant</code>). Nothing renders differently yet.</div>
        <dl class=&quot;meta&quot;>
          <dt>Touches</dt><dd>Data model / company record, one new <code>plan.ts</code> util</dd>
          <dt>UI change</dt><dd><b>None</b></dd>
        </dl>
        <div class=&quot;ac&quot;><div class=&quot;ac-t&quot;>✓ Done when</div><ul><li>Every account has a <code>plan</code> value; existing users render identically to before.</li><li><code>can('feature')</code> returns correct booleans in a unit test for all three tiers.</li></ul></div>
      </div>
    </div>

    <div class=&quot;step s1&quot;>
      <div class=&quot;step-num&quot;>1</div>
      <div class=&quot;step-body&quot;>
        <div class=&quot;step-head&quot;><span class=&quot;step-title&quot;>Consolidate existing gates</span><span class=&quot;risk low&quot;>LOW RISK</span></div>
        <div class=&quot;step-what&quot;>Replace the hand-written ROE &amp;amp; Payroll-Journal locks with the shared <code>can()</code> + <code>&amp;lt;UpgradePrompt&amp;gt;</code>. Refactor only code that already gates — no new screens.</div>
        <dl class=&quot;meta&quot;>
          <dt>Touches</dt><dd>Reports screen (existing locked cards)</dd>
          <dt>UI change</dt><dd>Visually identical; one reusable component now</dd>
        </dl>
        <div class=&quot;ac&quot;><div class=&quot;ac-t&quot;>✓ Done when</div><ul><li>ROE &amp;amp; Journal still lock/unlock exactly as before, now via the shared component.</li><li>Adding a new gated feature is a one-liner.</li></ul></div>
      </div>
    </div>

    <div class=&quot;step s2&quot;>
      <div class=&quot;step-num&quot;>2</div>
      <div class=&quot;step-body&quot;>
        <div class=&quot;step-head&quot;><span class=&quot;step-title&quot;>Make the sidebar plan-aware</span><span class=&quot;risk low&quot;>LOW RISK</span></div>
        <div class=&quot;step-what&quot;>Drive the nav from a config array and wrap each item in <code>can()</code>. Solo renders 5 items, Growth 10, Accountant 13. Add the &quot;Compliance / Analytics&quot; group headings. Show a single subtle upsell at the bottom for Solo — never a wall of greyed-out items.</div>
        <dl class=&quot;meta&quot;>
          <dt>Touches</dt><dd>Sidebar component only</dd>
          <dt>Visual target</dt><dd><b>MapleRun Adaptive Dashboard</b> (sidebar morphs as you toggle)</dd>
        </dl>
        <div class=&quot;ac&quot;><div class=&quot;ac-t&quot;>✓ Done when</div><ul><li>Toggling <code>plan</code> shows 5 / 10 / 13 items with correct grouping.</li><li>No hidden route is reachable by URL on a plan that shouldn't have it (guard the routes too).</li></ul></div>
      </div>
    </div>

    <div class=&quot;step s3&quot;>
      <div class=&quot;step-num&quot;>3</div>
      <div class=&quot;step-body&quot;>
        <div class=&quot;step-head&quot;><span class=&quot;step-title&quot;>Dashboard compliance layer + first new report</span><span class=&quot;risk med&quot;>ADDITIVE</span></div>
        <div class=&quot;step-what&quot;>Render dashboard stat cards from a per-plan config (Solo 4 → Growth +remittance/EFT/employer-cost → Accountant +Action-Required panel &amp;amp; year-end card). Then build the <b>Payroll Summary report</b> — it only aggregates finalised pay runs, so no new data model.</div>
        <dl class=&quot;meta&quot;>
          <dt>Touches</dt><dd>Dashboard (extend), new <code>/reports/summary</code> route</dd>
          <dt>Visual targets</dt><dd><b>Adaptive Dashboard</b> + <b>Payroll Summary Report</b></dd>
          <dt>Data</dt><dd>Aggregate existing pay-run records — gross, CPP, EI, tax, net, employer cost</dd>
        </dl>
        <div class=&quot;ac&quot;><div class=&quot;ac-t&quot;>✓ Done when</div><ul><li>Dashboard cards/panel match the mock per tier; no lower-tier card is removed.</li><li>Payroll Summary totals reconcile to the sum of underlying pay runs; PDF/CSV export works.</li></ul></div>
      </div>
    </div>

    <div class=&quot;step s4&quot;>
      <div class=&quot;step-num&quot;>4</div>
      <div class=&quot;step-body&quot;>
        <div class=&quot;step-head&quot;><span class=&quot;step-title&quot;>Wizard pay-types + remaining P1 screens</span><span class=&quot;risk med&quot;>ADDITIVE</span></div>
        <div class=&quot;step-what&quot;>Extend Run Payroll Step 1 with the progressive-disclosure pattern (Solo 2 fields → Growth + expander → Accountant full grid). Then work the P1 list: Remittances section, EFT centre, Exception report, Termination wizard, Audit Trail.</div>
        <dl class=&quot;meta&quot;>
          <dt>Touches</dt><dd>Wizard Step 1 (extend), new routes per screen</dd>
          <dt>Visual target</dt><dd><b>Adaptive Wizard</b> (click the expander to see disclosure)</dd>
        </dl>
        <div class=&quot;ac&quot;><div class=&quot;ac-t&quot;>✓ Done when</div><ul><li>Solo wizard is unchanged from today; extra pay types appear only behind the expander / at Accountant tier.</li><li>Each new screen is gated and routes are guarded.</li></ul></div>
      </div>
    </div>
  </div>

  <!-- FILE MAP -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Reference Files</div>
    <div class=&quot;sec-title&quot;>What each deliverable is for</div>
    <div class=&quot;sec-sub&quot;>The mocks are interactive visual targets — open them, toggle the plan, and build to match. Specs are read-only references.</div>
    <table class=&quot;fmap&quot;>
      <thead><tr><th>File</th><th>Type</th><th>Use it for</th></tr></thead>
      <tbody>
        <tr><td><a href=&quot;MapleRun Gap Analysis.html&quot;>MapleRun Gap Analysis</a></td><td><span class=&quot;tag spec&quot;>SPEC</span></td><td>The full feature backlog, plan matrix, and P1/P2/P3 priorities. The &quot;why&quot; behind everything.</td></tr>
        <tr><td><a href=&quot;MapleRun Adaptive Dashboard.html&quot;>MapleRun Adaptive Dashboard</a></td><td><span class=&quot;tag target&quot;>BUILD TARGET</span></td><td>Step 2 (sidebar) + Step 3 (dashboard cards/panel). Toggle plan to see each tier's exact layout.</td></tr>
        <tr><td><a href=&quot;MapleRun Adaptive Wizard.html&quot;>MapleRun Adaptive Wizard</a></td><td><span class=&quot;tag target&quot;>BUILD TARGET</span></td><td>Step 4 wizard. The progressive-disclosure / expander pattern for pay types.</td></tr>
        <tr><td><a href=&quot;MapleRun Payroll Summary Report.html&quot;>MapleRun Payroll Summary Report</a></td><td><span class=&quot;tag target&quot;>BUILD TARGET</span></td><td>Step 3 report. Filter bar, totals, by-employee table, export controls.</td></tr>
        <tr><td class=&quot;mono&quot;>screens/*.html</td><td><span class=&quot;tag ref&quot;>EXISTING</span></td><td>The current app. The CSS vocabulary (dark sidebar, Inter + Geist Mono, maple-red, stone) to match. <b>Do not rewrite these.</b></td></tr>
      </tbody>
    </table>
  </div>

  <!-- DO / DONT -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Guardrails</div>
    <div class=&quot;sec-title&quot;>Do / Don't</div>
    <div class=&quot;two&quot;>
      <div class=&quot;card do&quot;>
        <h4>✅ Do</h4>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>→</span><div>Render nav, dashboard cards, and wizard fields from <b>per-plan config objects</b> (see the mocks' JS — they already do this).</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>→</span><div>Gate at <b>both</b> the UI and the route/API — a Solo user shouldn't reach <code>/year-end</code> by typing the URL.</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>→</span><div>Keep every locked feature's upgrade path one click away, reusing <code>&amp;lt;UpgradePrompt&amp;gt;</code>.</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>→</span><div>Reuse existing components &amp;amp; CSS tokens so new screens are visually seamless.</div></div>
      </div>
      <div class=&quot;card dont&quot;>
        <h4>⛔ Don't</h4>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>✕</span><div>Build a separate &quot;lite&quot; app or fork screens per plan. One codebase, gated.</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>✕</span><div>Show Solo users greyed-out walls of features they can't use — render <i>less</i>, not <i>disabled</i>.</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>✕</span><div>Touch the wizard calc engine, pay stubs, T4, or employee ledger — they're strong; only extend additively.</div></div>
        <div class=&quot;lirow&quot;><span class=&quot;i&quot;>✕</span><div>Invent new colours or fonts — the system is fixed (maple-red #B3261E, stone neutrals, Inter + Geist Mono).</div></div>
      </div>
    </div>
  </div>

  <!-- QA CHECKLIST -->
  <div class=&quot;section&quot;>
    <div class=&quot;sec-label&quot;>Before Merge</div>
    <div class=&quot;sec-title&quot;>QA checklist</div>
    <div class=&quot;sec-sub&quot;>Run this against all three plan values for every PR in the rollout.</div>
    <div class=&quot;checklist&quot;>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Existing accounts unchanged</b><div class=&quot;s&quot;>A pre-rollout account on its default tier renders pixel-identically to before Step 0.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Solo stays minimal</b><div class=&quot;s&quot;>5 nav items, 4 dashboard cards, 2-field wizard. No remittance/EFT/compliance/year-end anywhere.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Additive only</b><div class=&quot;s&quot;>No card or field present at a lower tier disappears at a higher tier — tiers only add.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Routes guarded</b><div class=&quot;s&quot;>Direct-URL access to a gated route on the wrong plan redirects to an upgrade prompt, not a 500 or a blank page.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Upgrade path works</b><div class=&quot;s&quot;>Every lock surfaces <code>&amp;lt;UpgradePrompt&amp;gt;</code> with a working CTA.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Payroll Summary reconciles</b><div class=&quot;s&quot;>Report totals equal the sum of the underlying finalised pay runs; PDF &amp;amp; CSV export match the on-screen figures.</div></div></div>
      <div class=&quot;ck&quot;><div class=&quot;box&quot;></div><div><b>Visual parity</b><div class=&quot;s&quot;>New screens use the existing sidebar, type scale, and maple-red accent — indistinguishable from current screens.</div></div></div>
    </div>
  </div>

  <div class=&quot;note amber&quot;><div class=&quot;ni&quot;>📌</div><div class=&quot;nt&quot;><b>Suggested first PR:</b> Steps 0 + 1 together (flag + gate consolidation). It ships with zero visible change, proves the architecture, and unblocks every screen after it. Steps 2–4 can then land independently and in parallel.</div></div>

</div>
</body>
</html>
"></iframe>
</div>
<script>
document.querySelector('.tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  const id=b.dataset.id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
  document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on', f.id==='f-'+id));
});
</script>
</body>
